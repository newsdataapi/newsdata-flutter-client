name: newsdataapi
description: >-
  Official Dart/Flutter client for the Newsdata.io News API: real-time,
  historical, crypto & market news with retries, pagination and typed errors.
version: 0.2.0
homepage: https://newsdata.io
repository: https://github.com/newsdataapi/newsdata-flutter-client
issue_tracker: https://github.com/newsdataapi/newsdata-flutter-client/issues

topics:
  - news
  - news-api
  - newsdata
  - sdk
  - api-client

environment:
  # 3.2 is the floor: web_socket_channel (used for real-time streaming) has no
  # release that supports Dart 3.0/3.1 — 2.4.0 caps at <3.0.0 and 2.4.1+
  # requires ^3.2.0.
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  http: ^1.1.0
  meta: ^1.10.0
  # Real-time WebSocket streaming. dart:io's WebSocket would not work on the
  # web; web_socket_channel covers both native and browser targets.
  # Widened rather than pinned to ^3.0.0 so Dart 3.2 can resolve 2.4.x while
  # 3.3+ gets the current 3.x line.
  web_socket_channel: '>=2.4.1 <4.0.0'

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
